<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B232B">
<title>Di Castro – Cantiere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAE5;--ink:#1B232B;--muted:#5C6671;--card:#FFFFFF;--line:#CEC9C0;
  --ddt:#F2C230;--ddt-ink:#1B232B;--form:#E2622A;--form-ink:#FFFFFF;--foto:#2A62C4;--foto-ink:#FFFFFF;--var:#6E4BB0;--var-ink:#FFFFFF;
  --ok:#2E8A4F;--err:#C23A2B;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--bg:#151B21;--ink:#EDEFF1;--muted:#98A3AE;--card:#202830;--line:#33404C}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--foto);outline-offset:3px}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px}
.who{margin-left:auto;color:var(--muted);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:48px;display:flex;align-items:center;gap:6px;padding:0 14px;font-family:var(--display);font-weight:700;font-size:20px}
.iconbtn svg{width:22px;height:22px}
.big{flex:1;min-height:118px;border:0;border-radius:22px;margin-bottom:14px;display:flex;align-items:center;gap:18px;padding:0 24px;text-align:left;transition:transform .08s}
.big:active{transform:scale(.98)}
.big:last-child{margin-bottom:0}
.big svg{width:56px;height:56px;flex:none}
.big .lbl{font-family:var(--display);font-weight:800;font-size:clamp(48px,14vw,68px);line-height:.9;display:block}
.big .sub{font-size:16px;opacity:.85;display:block;margin-top:6px}
.t-ddt{background:var(--ddt);color:var(--ddt-ink)}.t-formulari{background:var(--form);color:var(--form-ink)}.t-foto{background:var(--foto);color:var(--foto-ink)}.t-var{background:var(--var);color:var(--var-ink)}
.band{border-radius:18px;padding:16px 20px;margin-bottom:16px}
.band h1{margin:0;font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.band p{margin:4px 0 0;font-size:17px;opacity:.9}
.search{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 16px;font-size:18px;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:10px}
.row{width:100%;min-height:76px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 18px;text-align:left}
.row:active{background:var(--bg)}
.row .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;display:block}
.row .a{color:var(--muted);font-size:15px;display:block;margin-top:2px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pick{min-height:120px;border-radius:18px;border:2px solid var(--ink);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:700;font-size:24px;line-height:1;padding:10px}
.pick svg{width:38px;height:38px}
.pick.primary{background:var(--ink);color:var(--bg)}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:14px}
.qi{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.qi img{width:100%;height:100%;object-fit:cover;display:block}
.qi .pdf{width:100%;height:100%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:var(--err)}
.qi .x{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;line-height:1}
.qi .st{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.6)}
.qi .st.ok{background:var(--ok)}.qi .st.err{background:var(--err)}
label.fl{display:block;font-weight:600;margin:4px 0 6px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;font-size:17px;resize:vertical}
.sendbar{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(to top,var(--bg) 75%,transparent);margin-top:auto}
.send{width:100%;height:68px;border:0;border-radius:18px;font-family:var(--display);font-weight:800;font-size:30px}
.send:disabled{opacity:.4;cursor:not-allowed}
.msg{border-radius:14px;padding:14px 16px;margin-bottom:14px;font-weight:600}
.msg.err{background:color-mix(in srgb,var(--err) 14%,var(--card));color:var(--err)}
.done{justify-content:center;gap:14px;text-align:center}
.tick{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 6px}
.tick svg{width:56px;height:56px}
.done h1,.login h1{font-family:var(--display);font-weight:800;font-size:48px;margin:0;line-height:1}
.done p{margin:0 0 10px;color:var(--muted);font-size:18px}
.btn2{height:64px;border-radius:16px;border:2px solid var(--ink);background:var(--card);font-family:var(--display);font-weight:700;font-size:24px;width:100%}
.btn2.solid{background:var(--ink);color:var(--bg)}
.login{justify-content:center;gap:16px}
.login p{margin:0;color:var(--muted)}
.recent{margin:16px 0 4px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px}
.recent .rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.recent h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.recent .rb{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;padding:0 12px;font-size:15px;font-weight:600}
.recent .rs{margin:6px 0 0;color:var(--muted);font-size:15px}
.recent ul{list-style:none;margin:6px 0 0;padding:0}
.recent li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.recent li:first-child{border-top:0}
.recent li.new{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-radius:10px;padding-left:8px;padding-right:8px;border-top-color:transparent}
.recent .rc{font-weight:600}
.recent .rw{color:var(--muted);font-size:15px}
.recent .rt{color:var(--muted);font-size:15px;white-space:nowrap}
.done .recent{text-align:left}
.recent li{align-items:center}
.recent .th{flex:none;width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);position:relative;padding:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.recent .th img{width:100%;height:100%;object-fit:cover;display:block}
.recent .th .b{position:absolute;left:0;right:0;bottom:0;font-size:11px;line-height:16px;background:var(--err);color:#fff;text-align:center}
.recent .rx{flex:1;min-width:0}
.viewer{position:fixed;inset:0;z-index:50;background:#0B0E11;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer .vt{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff}
.viewer .vt span{flex:1;font-size:15px;min-width:0}
.viewer .vc{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;padding:0 16px;font-family:var(--display);font-weight:700;font-size:20px}
.viewer .vi{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;color:#fff}
.viewer .vi img{max-width:100%;max-height:100%;object-fit:contain}
.arch-btn{width:100%;min-height:64px;border-radius:18px;border:2px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-weight:800;font-size:28px;margin-top:2px}
.arch-btn svg{width:30px;height:30px}
.t-arch{background:#3B4652;color:#fff}
.a-cant{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.a-cant button,.a-chips button{min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:4px 14px;font-weight:600;font-size:16px;text-align:left}
.a-cant button[aria-pressed=true],.a-chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.a-tipi{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.a-tipi button{min-height:62px;border-radius:14px;border:3px solid transparent;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.a-tipi button b{font-size:22px;font-weight:800}
.a-tipi button[aria-pressed=false]{opacity:.5}
.a-tipi button[aria-pressed=true]{border-color:var(--ink)}
.a-tipi .k-tutti{background:var(--card);color:var(--ink);border-color:var(--line)}
.a-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.a-chips button{flex:none;border-radius:22px;font-size:15px;min-height:42px}
.a-info{font-size:15px;color:var(--muted);margin:6px 0 2px}
.a-day{font-family:var(--display);font-weight:700;font-size:20px;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.a-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.a-th{display:block;width:100%;border:0;padding:0;background:none;text-align:left;min-width:0;overflow:hidden}
.a-th .im{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--muted)}
.a-th .im img{width:100%;height:100%;object-fit:cover;display:block}
.a-th .tg{position:absolute;left:5px;top:5px;border-radius:8px;padding:1px 7px;font-family:var(--display);font-weight:700;font-size:14px}
.a-th .or{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;font-weight:600}
.a-th .cp{display:block;font-size:13px;line-height:1.25;margin-top:4px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-th .cp b{color:var(--ink);font-weight:600}
.viewer .vn{display:flex;gap:8px}
.viewer .vf{padding:10px 16px 14px;color:#fff;font-size:15px}
.viewer .vf p{margin:4px 0 10px;font-size:17px}
.viewer .vf .va{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.viewer .vf a,.viewer .vf button{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;font-family:var(--display);font-weight:700;font-size:19px;display:grid;place-items:center;text-decoration:none}
.viewer .vc:disabled{opacity:.3}
.pin{width:100%;height:80px;border:2px solid var(--ink);border-radius:18px;background:var(--card);text-align:center;font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.3em}
</style>
</head>
<body>
<div class="wrap">

<section id="s-login" class="screen login hidden">
  <div class="brand">Di Castro</div>
  <h1>Inserisci il PIN</h1>
  <p>Il PIN personale te lo dà l'ufficio tecnico. Lo inserisci una volta sola su questo telefono.</p>
  <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="8" aria-label="PIN">
  <div id="login-msg"></div>
  <button class="btn2 solid" id="btn-login">Entra</button>
</section>

<section id="s-home" class="screen hidden">
  <div class="top">
    <span class="brand">Di Castro</span>
    <span class="who" id="who"></span>
    <button class="iconbtn" id="btn-logout" aria-label="Cambia utente">Esci</button>
  </div>
  <button class="big t-ddt" data-tipo="ddt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4h14v11H1z"/><path d="M15 8h4l3 3v4h-7z"/><circle cx="5.5" cy="17.5" r="2"/><circle cx="18.5" cy="17.5" r="2"/></svg>
    <span><span class="lbl">DDT</span><span class="sub">Documento di trasporto</span></span>
  </button>
  <button class="big t-formulari" data-tipo="formulari">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
    <span><span class="lbl">Formulari</span><span class="sub">Rifiuti (FIR)</span></span>
  </button>
  <button class="big t-foto" data-tipo="foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span><span class="lbl">Foto</span><span class="sub">Avanzamento lavori</span></span>
  </button>
  <button class="big t-var" data-tipo="variante">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span><span class="lbl">Variante</span><span class="sub">Segnala una modifica con foto</span></span>
  </button>
  <button class="arch-btn" id="btn-arch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Archivio</button>
</section>

<section id="s-archivio" class="hidden">
  <div class="top"><button class="iconbtn" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Indietro</button></div>
  <div class="band t-arch"><h1>Archivio</h1><p>DDT, formulari, foto e varianti caricati.</p></div>
  <div class="a-cant" id="a-cant"></div>
  <div class="a-tipi" id="a-tipi">
    <button class="k-tutti" data-t="" aria-pressed="true"><b data-n="tutti">–</b>Tutti</button>
    <button class="t-ddt" data-t="DDT" aria-pressed="false"><b data-n="DDT">–</b>DDT</button>
    <button class="t-formulari" data-t="FIR" aria-pressed="false"><b data-n="FIR">–</b>Formul.</button>
    <button class="t-foto" data-t="FOTO" aria-pressed="false"><b data-n="FOTO">–</b>Foto</button>
    <button class="t-var" data-t="VAR" aria-pressed="false"><b data-n="VAR">–</b>Varianti</button>
  </div>
  <input class="search" id="a-q" type="search" placeholder="Cerca nelle note: fornitore, n° DDT, SV-…" autocomplete="off">
  <div class="a-chips" id="a-per">
    <button data-v="" aria-pressed="true">Sempre</button>
    <button data-v="oggi" aria-pressed="false">Oggi</button>
    <button data-v="7" aria-pressed="false">7 giorni</button>
    <button data-v="30" aria-pressed="false">30 giorni</button>
  </div>
  <div class="a-chips" id="a-chi"></div>
  <p class="a-info" id="a-info"></p>
  <div id="a-list"></div>
  <button class="btn2 hidden" id="a-more" style="margin-top:16px">Mostra i più vecchi</button>
</section>

<section id="s-cantieri" class="hidden">
  <div class="top"><button class="iconbtn" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Indietro</button></div>
  <div class="band" id="band-c"><h1 id="c-title"></h1><p>Scegli il cantiere</p></div>
  <input class="search hidden" id="search" type="search" placeholder="Cerca cantiere" autocomplete="off">
  <div class="list" id="c-list"></div>
</section>


<section id="s-upload" class="screen hidden">
  <div class="top"><button class="iconbtn" data-go="cantieri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Cantieri</button></div>
  <div class="band" id="band-u"><h1 id="u-title"></h1><p id="u-cant"></p></div>
  <div id="u-msg"></div>
  <div class="pickers">
    <button class="pick primary" id="btn-cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Scatta foto</button>
    <button class="pick" id="btn-gal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Dal telefono</button>
  </div>
  <input type="file" id="in-cam" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="in-gal" multiple class="hidden">
  <div class="queue" id="queue"></div>
  <label class="fl" for="nota" id="nota-lbl">Nota (facoltativa)</label>
  <textarea id="nota"></textarea>
  <div class="recent hidden" id="u-recent"></div>
  <div class="sendbar"><button class="send" id="send" disabled>Invia</button></div>
</section>

<section id="s-done" class="screen done hidden">
  <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
  <h1>Inviato</h1>
  <p id="done-txt"></p>
  <div class="recent hidden" id="d-recent"></div>
  <button class="btn2 solid" id="done-more">Carica altro qui</button>
  <button class="btn2" data-go="home">Torna all'inizio</button>
</section>

</div>
<script>
/* ===== CONFIGURAZIONE: URL base dei webhook n8n (produzione) ===== */
const API_BASE = "https://dicastro.app.n8n.cloud/webhook";
/* ================================================================ */

(() => {
  const TIPI = {
    ddt:{label:"DDT",cls:"t-ddt",accept:"image/*,application/pdf",hint:"Es. fornitore, numero DDT, materiale"},
    formulari:{label:"Formulari",cls:"t-formulari",accept:"image/*,application/pdf",hint:"Es. numero FIR, trasportatore, CER"},
    foto:{label:"Foto",cls:"t-foto",accept:"image/*",hint:"Es. zona, lavorazione"},
    variante:{label:"Variante",cls:"t-var",accept:"image/*",hint:"Cosa cambia, dove e perché. Es. spostamento tramezzo cucina di 40 cm, richiesto dalla DL"}
  };
  const MAX_FOTO_VARIANTE = 5;
  const $ = s => document.querySelector(s);
  const el = (tag, attrs={}, kids=[]) => {
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs)) {
      if (k==="class") n.className=v; else if (k==="text") n.textContent=v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v);
    }
    for (const c of [].concat(kids)) if (c) n.append(c);
    return n;
  };
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k){ try { localStorage.removeItem(k); } catch {} }
  };
  const S = { pin:null, nome:"", cantieri:[], tipo:null, cantiere:null, fase:"", queue:[], sending:false };

  function go(s){
    ["login","home","cantieri","upload","done","archivio"].forEach(x => $("#s-"+x).classList.toggle("hidden", x!==s));
    window.scrollTo(0,0);
  }
  function msg(sel, text){ const b=$(sel); b.replaceChildren(); if(text) b.append(el("div",{class:"msg err",text})); }

  async function post(path, fields, file, timeoutMs=30000){
    const fd = new FormData();
    for (const [k,v] of Object.entries(fields)) fd.append(k, v ?? "");
    if (Array.isArray(file)) file.forEach((f,i) => fd.append("foto"+i, f.blob, f.name));
    else if (file) fd.append("file", file.blob, file.name);
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), timeoutMs);
    try {
      const r = await fetch(API_BASE + path, {method:"POST", body:fd, signal:ctl.signal});
      let data = {}; try { data = await r.json(); } catch {}
      if (!r.ok || data.ok === false) throw Object.assign(new Error(data.errore || ("Errore " + r.status)), {status:r.status});
      return data;
    } catch(e){
      if (e.name === "AbortError") throw new Error("Connessione lenta o assente. Riprova.");
      if (e instanceof TypeError) throw new Error("Nessuna connessione. Riprova quando c'è campo.");
      throw e;
    } finally { clearTimeout(t); }
  }

  /* ---- login & dati ---- */
  async function loadDati(pin){
    const d = await post("/app-dati", {pin});
    S.pin = pin; S.nome = d.nome || ""; S.cantieri = d.cantieri || [];
    store.set("dc_pin", pin); store.set("dc_cantieri", S.cantieri); store.set("dc_nome", S.nome);
    $("#who").textContent = S.nome;
  }
  $("#btn-login").addEventListener("click", async () => {
    const pin = $("#pin").value.trim();

    $("#btn-login").disabled = true; msg("#login-msg","");
    try { await loadDati(pin); go("home"); }
    catch(e){ msg("#login-msg", e.status === 401 ? "PIN non valido." : e.message); }
    finally { $("#btn-login").disabled = false; }
  });
  $("#pin").addEventListener("keydown", e => { if (e.key === "Enter") $("#btn-login").click(); });
  $("#btn-logout").addEventListener("click", () => {
    ["dc_pin","dc_cantieri","dc_nome"].forEach(store.del);
    S.pin = null; $("#pin").value = ""; A.files = []; A.cantieri = null; A.persone = []; go("login");
  });

  /* ---- navigazione ---- */
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]"); if (!g) return;
    if (g.dataset.go === "cantieri") openCantieri(S.tipo); else { resetQueue(); go(g.dataset.go); }
  });
  document.querySelectorAll(".big[data-tipo]").forEach(b => b.addEventListener("click", () => openCantieri(b.dataset.tipo)));

  /* ---- cantieri ---- */
  function openCantieri(tipo){
    S.tipo = tipo;
    $("#band-c").className = "band " + TIPI[tipo].cls;
    $("#c-title").textContent = TIPI[tipo].label;
    $("#search").value = "";
    renderCantieri(); go("cantieri");
    // aggiorna in background: la lista in cache resta visibile se non c'è campo
    loadDati(S.pin).then(renderCantieri).catch(e => { if (e.status === 401) $("#btn-logout").click(); });
  }
  function renderCantieri(){
    const list = $("#c-list"); list.replaceChildren();
    const q = $("#search").value.trim().toLowerCase();
    $("#search").classList.toggle("hidden", S.cantieri.length <= 6);
    if (!S.cantieri.length){ list.append(el("div",{class:"empty",text:"Nessun cantiere attivo. Avvisa l'ufficio tecnico."})); return; }
    const rows = S.cantieri.filter(c => !q || (c.nome+" "+(c.indirizzo||"")).toLowerCase().includes(q));
    if (!rows.length){ list.append(el("div",{class:"empty",text:"Nessun cantiere trovato."})); return; }
    for (const c of rows) list.append(el("button",{class:"row",onclick:()=>scegliCantiere(c)},[
      el("span",{class:"n",text:c.nome}), c.indirizzo ? el("span",{class:"a",text:c.indirizzo}) : null
    ]));
  }
  $("#search").addEventListener("input", renderCantieri);

  function scegliCantiere(c){ S.cantiere = c; S.fase = ""; openUpload(c); }

  /* ---- upload ---- */
  function openUpload(c){
    S.cantiere = c;
    $("#band-u").className = "band " + TIPI[S.tipo].cls;
    $("#u-title").textContent = TIPI[S.tipo].label;
    $("#u-cant").textContent = c.nome;
    $("#in-gal").setAttribute("accept", TIPI[S.tipo].accept);
    $("#send").className = "send " + TIPI[S.tipo].cls;
    $("#nota").placeholder = TIPI[S.tipo].hint;
    $("#nota-lbl").textContent = S.tipo === "variante" ? "Descrizione della variante (obbligatoria)" : "Nota (facoltativa)";
    $("#in-gal").multiple = true;

    loadRecent("#u-recent");
  }
  function resetQueue(){
    S.queue.forEach(q => q.preview && URL.revokeObjectURL(q.preview));
    S.queue = []; $("#nota").value = ""; renderQueue();
  }
  $("#btn-cam").addEventListener("click", () => $("#in-cam").click());
  $("#btn-gal").addEventListener("click", () => $("#in-gal").click());
  ["#in-cam","#in-gal"].forEach(id => $(id).addEventListener("change", e => {
    for (const f of e.target.files) addFile(f); e.target.value = "";
  }));
  function addFile(f){
    const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
    const isImg = f.type.startsWith("image/") || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name);
    if (!isPdf && !isImg){ msg("#u-msg","Formato non accettato: "+f.name+". Carica foto o PDF."); return; }
    if (isPdf && S.tipo === "foto"){ msg("#u-msg","Nella sezione Foto carica solo immagini."); return; }
    if (S.tipo === "variante"){
      if (isPdf){ msg("#u-msg","Per la variante carica solo foto."); return; }
      if (S.queue.length >= MAX_FOTO_VARIANTE){ msg("#u-msg",`Al massimo ${MAX_FOTO_VARIANTE} foto per variante.`); return; }
    }
    S.queue.push({file:f, isPdf, preview:isImg ? URL.createObjectURL(f) : null, status:""});
    renderQueue();
  }
  function renderQueue(){
    const q = $("#queue"); q.replaceChildren();
    S.queue.forEach((it,i) => {
      const box = el("div",{class:"qi"});
      box.append(it.isPdf ? el("div",{class:"pdf",text:"PDF"}) : el("img",{src:it.preview,alt:""}));
      if (!S.sending && it.status !== "ok") box.append(el("button",{class:"x","aria-label":"Rimuovi",text:"×",onclick:()=>{ if(it.preview) URL.revokeObjectURL(it.preview); S.queue.splice(i,1); renderQueue(); }}));
      if (it.status) box.append(el("div",{class:"st "+(it.status==="ok"?"ok":it.status==="err"?"err":""),text:it.status==="ok"?"Inviato":it.status==="err"?"Errore":"Invio…"}));
      q.append(box);
    });
    const pending = S.queue.filter(x => x.status !== "ok").length;
    const b = $("#send");
    if (S.tipo === "variante"){
      const desc = $("#nota").value.trim().length >= 5;
      b.disabled = !pending || !desc || S.sending;
      b.textContent = S.sending ? "Invio in corso…" : !pending ? "Aggiungi le foto" : !desc ? "Scrivi la descrizione" : `Invia variante (${pending} foto)`;
      return;
    }
    b.disabled = !pending || S.sending;
    b.textContent = S.sending ? "Invio in corso…" : pending ? `Invia ${pending} file` : "Invia";
  }
  async function toJpeg(file){
    const MAX = 2400;
    let src;
    try { src = await createImageBitmap(file, {imageOrientation:"from-image"}); }
    catch { src = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); }); }
    const r = Math.min(1, MAX/Math.max(src.width, src.height));
    const c = document.createElement("canvas"); c.width = Math.round(src.width*r); c.height = Math.round(src.height*r);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Impossibile leggere la foto.")),"image/jpeg",0.85));
  }
  $("#nota").addEventListener("input", () => { if (S.tipo === "variante") renderQueue(); });
  async function inviaVariante(){
    S.sending = true; msg("#u-msg","");
    S.queue.forEach(it => it.status = "busy"); renderQueue();
    try {
      const files = [];
      for (const it of S.queue) files.push({blob: await toJpeg(it.file), name: "foto.jpg"});
      const d = await post("/app-variante", {pin:S.pin, cantiere_id:S.cantiere.id, descrizione:$("#nota").value.trim()}, files, 120000);
      S.queue.forEach(it => it.status = "ok");
      S.sending = false; renderQueue();
      $("#done-txt").textContent = `Variante ${d.codice || ""} inviata – ${S.cantiere.nome}. L'ufficio tecnico riceve una mail.`;
      go("done"); loadRecent("#d-recent");
    } catch(e){
      S.queue.forEach(it => it.status = "err");
      S.sending = false; renderQueue();
      if (e.status === 401){ $("#btn-logout").click(); return; }
      msg("#u-msg", "Variante non inviata. " + e.message + " Premi di nuovo Invia per riprovare.");
      S.queue.forEach(it => it.status = ""); renderQueue();
    }
  }
  $("#send").addEventListener("click", async () => {
    if (S.sending) return;
    if (S.tipo === "variante") return inviaVariante();
    S.sending = true; msg("#u-msg",""); renderQueue();
    const nota = $("#nota").value.trim();
    let ok = 0, lastErr = "";
    for (const it of S.queue){
      if (it.status === "ok") continue;
      it.status = "busy"; renderQueue();
      try {
        const blob = it.isPdf ? it.file : await toJpeg(it.file);
        const name = it.isPdf ? (it.file.name || "documento.pdf") : "foto.jpg";
        await post("/app-upload", {pin:S.pin, tipo:S.tipo, fase:S.fase, cantiere_id:S.cantiere.id, nota}, {blob, name}, 90000);
        it.status = "ok"; ok++;
      } catch(e){
        it.status = "err"; lastErr = e.message;
        if (e.status === 401){ S.sending=false; $("#btn-logout").click(); return; }
      }
      renderQueue();
    }
    S.sending = false; renderQueue();
    const failed = S.queue.filter(x => x.status !== "ok").length;
    if (!failed){
      $("#done-txt").textContent = `${ok} file in ${TIPI[S.tipo].label} – ${S.cantiere.nome}`;
      go("done");
      loadRecent("#d-recent");
    } else msg("#u-msg", `${failed} file non inviati. ${lastErr} Premi di nuovo Invia per riprovare.`);
  });
  $("#done-more").addEventListener("click", () => openUpload(S.cantiere));

  /* ---- ultimi caricamenti del cantiere ---- */
  function quando(s){
    const [d, t=""] = String(s).split(" "); const [y,m,g] = d.split("-").map(Number);
    if (!y) return s;
    const oggi = new Date(); oggi.setHours(0,0,0,0);
    const diff = Math.round((oggi - new Date(y, m-1, g)) / 86400000);
    const ora = t.slice(0,5);
    return diff === 0 ? "oggi " + ora : diff === 1 ? "ieri " + ora : String(g).padStart(2,"0") + "/" + String(m).padStart(2,"0") + " " + ora;
  }
  function miniatura(u){
    const testo = u.cosa + " · " + u.chi + " · " + quando(u.quando);
    if (!u.anteprima) return el("span",{class:"th",text: u.pdf ? "PDF" : "—"});
    const img = el("img",{src:u.anteprima, alt:"Anteprima " + u.cosa, loading:"lazy"});
    img.addEventListener("error", () => img.replaceWith(document.createTextNode(u.pdf ? "PDF" : "—")));
    return el("button",{class:"th","aria-label":"Apri anteprima: " + testo, onclick:()=>apriAnteprima(u.grande || u.anteprima, testo)},
      [ img, u.pdf ? el("span",{class:"b",text:"PDF"}) : null ]);
  }
  function apriAnteprima(src, testo){
    const chiudi = () => { v.remove(); document.removeEventListener("keydown", esc); };
    const esc = e => { if (e.key === "Escape") chiudi(); };
    const img = el("img",{src, alt:testo});
    const corpo = el("div",{class:"vi"},[ img ]);
    img.addEventListener("error", () => corpo.replaceChildren(el("p",{text:"Anteprima non disponibile. Riprova con Aggiorna."})));
    const v = el("div",{class:"viewer",role:"dialog","aria-modal":"true","aria-label":testo},[
      el("div",{class:"vt"},[ el("span",{text:testo}), el("button",{class:"vc",text:"Chiudi",onclick:chiudi}) ]),
      corpo
    ]);
    corpo.addEventListener("click", e => { if (e.target === corpo) chiudi(); });
    document.addEventListener("keydown", esc);
    document.body.append(v);
  }
  async function loadRecent(sel){
    const box = $(sel); if (!S.cantiere || !S.pin) return;
    const cantiereId = S.cantiere.id;
    const tipo = S.tipo;
    const TITOLI = { ddt:"Ultimi DDT", formulari:"Ultimi formulari", foto:"Ultime foto", variante:"Ultime varianti" };
    const VUOTO = { ddt:"Ancora nessun DDT caricato per questo cantiere.", formulari:"Ancora nessun formulario caricato per questo cantiere.", foto:"Ancora nessuna foto caricata per questo cantiere.", variante:"Ancora nessuna variante segnalata per questo cantiere." };
    const head = el("div",{class:"rh"},[ el("h2",{text:TITOLI[tipo] || "Ultimi caricamenti"}), el("button",{class:"rb",text:"Aggiorna",onclick:()=>loadRecent(sel)}) ]);
    box.replaceChildren(head, el("p",{class:"rs",text:"Carico…"})); box.classList.remove("hidden");
    try {
      const d = await post("/app-ultimi", {pin:S.pin, cantiere_id:cantiereId, tipo}, null, 15000);
      if (!S.cantiere || S.cantiere.id !== cantiereId || S.tipo !== tipo) return; // l'utente ha cambiato cantiere nel frattempo
      const items = d.ultimi || [];
      if (!items.length){ box.replaceChildren(head, el("p",{class:"rs",text:VUOTO[tipo] || "Ancora nessun file caricato per questo cantiere."})); return; }
      const ul = el("ul");
      items.forEach((u,i) => ul.append(el("li",{class: i===0 && quando(u.quando).startsWith("oggi") ? "new" : ""},[
        miniatura(u),
        el("span",{class:"rx"},[ el("span",{class:"rc",text:u.cosa}), el("span",{class:"rw",text:" · " + u.chi + (u.nota ? " · " + u.nota : "")}) ]),
        el("span",{class:"rt",text:quando(u.quando)})
      ])));
      const info = d.totale > items.length ? `Ultimi ${items.length} di ${d.totale}` : `${d.totale} file in totale`;
      box.replaceChildren(head, el("p",{class:"rs",text:info}), ul);
    } catch(e){
      if (e.status === 401){ $("#btn-logout").click(); return; }
      box.replaceChildren(head, el("p",{class:"rs",text:"Lista non disponibile ora. " + e.message}));
    }
  }

  /* ---- archivio ---- */
  const A = { cantiere:"", tipo:"", periodo:"", chi:"", q:"", files:[], totale:0, req:0, cantieri:null, persone:[] };
  const NOME_TIPO = { DDT:"DDT", FIR:"Formulario", FOTO:"Foto", VAR:"Variante" };
  const CLS_TIPO = { DDT:"t-ddt", FIR:"t-formulari", FOTO:"t-foto", VAR:"t-var" };
  const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
  function giornoLungo(s){
    const [y,m,g] = String(s).slice(0,10).split("-").map(Number); if (!y) return s;
    const d = new Date(y, m-1, g); const oggi = new Date(); oggi.setHours(0,0,0,0);
    const diff = Math.round((oggi - d) / 86400000);
    const base = GIORNI[d.getDay()] + " " + g + " " + MESI[m-1] + (y !== oggi.getFullYear() ? " " + y : "");
    return diff === 0 ? "Oggi, " + base : diff === 1 ? "Ieri, " + base : base.charAt(0).toUpperCase() + base.slice(1);
  }
  function pressed(box, attr, val){ box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset[attr] ?? "") === val))); }
  function chipCantieri(){
    const box = $("#a-cant"); const list = A.cantieri || S.cantieri.map(c => ({id:c.id, nome:c.nome}));
    box.replaceChildren(el("button",{"data-c":"",text:"Tutti i cantieri"}), ...list.map(c => el("button",{"data-c":c.id,text:c.nome})));
    pressed(box, "c", A.cantiere);
  }
  function chipPersone(){
    const box = $("#a-chi");
    box.replaceChildren(el("button",{"data-v":"",text:"Tutti"}), ...A.persone.map(p => el("button",{"data-v":p,text:p})));
    pressed(box, "v", A.chi); box.classList.toggle("hidden", A.persone.length < 2);
  }
  function openArchivio(){ go("archivio"); chipCantieri(); chipPersone(); if (!A.files.length) caricaArchivio(true); }
  async function caricaArchivio(daCapo){
    const req = ++A.req;
    if (daCapo){ A.files = []; $("#a-list").replaceChildren(el("p",{class:"rs",text:"Carico…"})); }
    $("#a-more").disabled = true;
    try {
      const d = await post("/app-archivio", {pin:S.pin, cantiere_id:A.cantiere, tipo:A.tipo, periodo:A.periodo, chi:A.chi, q:A.q, offset:String(A.files.length)}, null, 30000);
      if (req !== A.req) return; // nel frattempo è cambiato un filtro
      A.cantieri = d.cantieri || A.cantieri; A.persone = d.persone || [];
      A.files = A.files.concat(d.files || []); A.totale = d.totale || 0;
      document.querySelectorAll("#a-tipi [data-n]").forEach(n => { const v = (d.conteggi || {})[n.dataset.n]; n.textContent = v == null ? "–" : v; });
      chipCantieri(); chipPersone(); disegnaArchivio();
    } catch(e){
      if (req !== A.req) return;
      if (e.status === 401){ $("#btn-logout").click(); return; }
      $("#a-list").replaceChildren(el("div",{class:"empty",text:"Archivio non disponibile ora. " + e.message}));
    } finally { $("#a-more").disabled = false; }
  }
  function disegnaArchivio(){
    const out = $("#a-list"); out.replaceChildren();
    $("#a-info").textContent = A.totale ? (A.totale === 1 ? "1 file" : A.totale + " file") : "";
    if (!A.files.length){ out.append(el("div",{class:"empty",text:"Nessun file con questi filtri."})); $("#a-more").classList.add("hidden"); return; }
    let giorno = "", grid;
    A.files.forEach((f,i) => {
      const g = f.quando.slice(0,10);
      if (g !== giorno){ giorno = g; grid = el("div",{class:"a-grid"}); out.append(el("div",{class:"a-day",text:giornoLungo(g)}), grid); }
      const im = el("span",{class:"im"});
      if (f.anteprima){ const img = el("img",{src:f.anteprima, alt:"", loading:"lazy"}); img.addEventListener("error", () => img.replaceWith(document.createTextNode(f.pdf ? "PDF" : "—"))); im.append(img); }
      else im.append(document.createTextNode(f.pdf ? "PDF" : "—"));
      im.append(el("span",{class:"tg " + (CLS_TIPO[f.tipo] || ""),text:f.tipo === "FIR" ? "FIR" : NOME_TIPO[f.tipo] || f.cosa}), el("span",{class:"or",text:f.quando.slice(11,16)}));
      const cap = el("span",{class:"cp"},[ el("b",{text:f.chi}) ]);
      const extra = (A.cantiere ? "" : " · " + f.cantiere) + (f.nota ? " · " + f.nota : "");
      if (extra) cap.append(document.createTextNode(extra));
      grid.append(el("button",{class:"a-th","aria-label":(NOME_TIPO[f.tipo] || f.cosa) + " " + f.quando + " " + f.chi, onclick:()=>vediFile(i)},[ im, cap ]));
    });
    $("#a-more").classList.toggle("hidden", A.files.length >= A.totale);
  }
  function vediFile(i){
    let cur = i; let x0 = null;
    const corpo = el("div",{class:"vi"});
    const titolo = el("span"); const pos = el("span",{style:"flex:none"});
    const prev = el("button",{class:"vc","aria-label":"Precedente",text:"‹"}); const next = el("button",{class:"vc","aria-label":"Successivo",text:"›"});
    const nota = el("p"); const drive = el("a",{target:"_blank",rel:"noopener",text:"Apri su Drive"});
    const condividi = el("button",{text:"Condividi"});
    const chiudi = () => { v.remove(); document.removeEventListener("keydown", tasti); };
    const v = el("div",{class:"viewer",role:"dialog","aria-modal":"true","aria-label":"File dell'archivio"},[
      el("div",{class:"vt"},[ el("button",{class:"vc",text:"Chiudi",onclick:chiudi}), pos, el("span"), el("span",{class:"vn"},[prev,next]) ]),
      corpo,
      el("div",{class:"vf"},[ titolo, nota, el("div",{class:"va"},[drive, condividi]) ])
    ]);
    const mostra = () => {
      const f = A.files[cur];
      corpo.replaceChildren(f.grande ? el("img",{src:f.grande, alt:(NOME_TIPO[f.tipo] || "") + " " + f.quando}) : el("p",{text: f.pdf ? "PDF: aprilo su Drive." : "Anteprima non disponibile: aprilo su Drive."}));
      titolo.textContent = (NOME_TIPO[f.tipo] || f.cosa) + " · " + giornoLungo(f.quando) + ", " + f.quando.slice(11,16) + " · " + f.chi + " · " + f.cantiere;
      nota.textContent = f.nota || ""; nota.style.display = f.nota ? "" : "none";
      drive.href = f.link;
      pos.textContent = (cur+1) + " di " + A.totale;
      prev.disabled = cur === 0; next.disabled = cur >= A.files.length - 1 && A.files.length >= A.totale;
    };
    const vai = async passo => {
      const n = cur + passo; if (n < 0) return;
      if (n >= A.files.length){ if (A.files.length >= A.totale) return; await caricaArchivio(false); if (n >= A.files.length) return; }
      cur = n; mostra();
    };
    prev.addEventListener("click", () => vai(-1)); next.addEventListener("click", () => vai(1));
    condividi.addEventListener("click", async () => {
      const f = A.files[cur]; const testo = (NOME_TIPO[f.tipo] || f.cosa) + " " + f.cantiere + " " + f.quando + (f.nota ? " – " + f.nota : "");
      if (navigator.share){ try { await navigator.share({title:testo, text:testo, url:f.link}); } catch {} }
      else { try { await navigator.clipboard.writeText(f.link); condividi.textContent = "Link copiato"; } catch { window.open(f.link, "_blank"); } }
    });
    corpo.addEventListener("touchstart", e => { if (e.touches.length === 1) x0 = e.touches[0].clientX; }, {passive:true});
    corpo.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) vai(dx < 0 ? 1 : -1); });
    const tasti = e => { if (e.key === "Escape") chiudi(); if (e.key === "ArrowRight") vai(1); if (e.key === "ArrowLeft") vai(-1); };
    document.addEventListener("keydown", tasti);
    document.body.append(v); mostra();
  }

  let tq; $("#a-q").addEventListener("input", e => { clearTimeout(tq); tq = setTimeout(() => { A.q = e.target.value.trim(); caricaArchivio(true); }, 450); });

})();
